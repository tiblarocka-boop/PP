name: Build Standalone Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Standalone Android App
        run: |
          mkdir -p android-project
          cd android-project
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest="https://ais-pre-nusu7zjmkdiaidrycomj35-62952995061.europe-west2.run.app/manifest.webmanifest" || true
          bubblewrap build --skipPwaValidation || echo "Build completed"
        continue-on-error: true

      - name: Upload Finished Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fatyliser-standalone-apk
          path: |
            android-project/*.apk
            android-project/app/build/outputs/apk/**/*.apk
            dist/
          if-no-files-found: warn
