name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build Android Project
      run: |
        echo "Searching for the folder containing settings.gradle or build.gradle..."
        TARGET_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
        
        if [ -z "$TARGET_DIR" ] || [ "$TARGET_DIR" = "." ]; then
          echo "Project files found in root or no subfolder found. Attempting global fallback..."
          gradle assembleDebug
        else
          echo "Found Android project files inside subfolder: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
        fi

    - name: Find and Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fatyliser-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
